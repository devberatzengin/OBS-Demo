# Local development profile (active by default).

# Load the demo data from db/dev as a repeatable migration: it runs once and again whenever the file changes.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# A dev database created earlier by Hibernate (ddl-auto) has no Flyway history yet:
# adopt it as version 1 instead of failing. Empty databases simply run V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.show-sql=true
