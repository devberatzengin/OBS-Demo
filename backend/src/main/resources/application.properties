spring.application.name=backend

# Profile used when none is set: local development (see application-dev.properties).
# Integration tests run with the "test" profile.
spring.profiles.default=dev

# Secrets come from environment variables. For local runs, copy .env.example to .env
# (git-ignored) in the repository root; it is read here and by docker compose.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Database (PostgreSQL from docker-compose.yml)
spring.datasource.url=${OBS_DB_URL}
spring.datasource.username=${OBS_DB_USER}
spring.datasource.password=${OBS_DB_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration

# JWT: no default on purpose, the application refuses to start without a 32+ byte secret.
obs.app.jwtSecret=${OBS_JWT_SECRET}

# Comma-separated list of frontend origins allowed to call the API.
obs.cors.allowed-origins=${OBS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
