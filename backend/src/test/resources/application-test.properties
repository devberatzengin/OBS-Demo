# Integration tests run against the Testcontainers PostgreSQL (see TestcontainersConfiguration).
# The real connection comes from @ServiceConnection; these values only satisfy the placeholders
# of application.properties so tests need no .env file. Flyway builds the schema from db/migration.
spring.datasource.url=jdbc:postgresql://localhost:5432/provided-by-testcontainers
spring.datasource.username=test
spring.datasource.password=test

obs.app.jwtSecret=test-only-jwt-secret-not-used-anywhere-else-0123456789
spring.jpa.show-sql=false
